# if given, will override the device setting in gym. 
notes:  "real weight, limb obs, power weight for capsule humanoid"
project_name: "crossroad_smpl"
env: 
  terrain_obs: True
  terrain_obs_type: "square"
  terrain_obs_root: "head"
  use_center_height: true
  real_data_mesh: false
  numEnvs: 1024
  envSpacing: 0
  episodeLength: 300
  isFlagrun: False
  enableDebugVis: False

  bias_offset: False
  has_self_collision: True
  has_mesh: False
  has_jt_limit: False
  has_dof_subset: True
  has_upright_start: True      # MUST be True: False puts the body flat in physics
                               # while observations look upright (see docs/根因-has_upright_start.md)
  has_smpl_pd_offset: False
  remove_toe: False
  real_weight_porpotion: True
  kp_scale: 1.0
  motion_sym_loss: True
  sym_loss_coef: 1

  kp_scale: 1
  real_weight: True
  power_reward: True

  # Bounded terrain-aware task reward.  All terms share one 500-epoch ramp.
  enable_safe_stepping_reward: true
  enable_velocity_reward: true
  enable_collision_penalty: true
  enable_edge_penalty: false
  collision_reward_weight: 0.20
  landing_reward_weight: 0.15
  impact_reward_weight: 0.05
  velocity_reward_weight: 0.10
  velocity_error_scale: 2.0
  safe_reward_clip: 0.25
  safe_reward_warmup_steps: 16000  # 500 PPO epochs x horizon 32
  edge_reward_weight: 0.10
  collision_reward_warmup_steps: 16000  # legacy single-term fallback
  edge_reward_warmup_steps: 16000
  collision_unsafe_distance: 0.20
  collision_cone_deg: 30.0
  collision_height_threshold: 0.03
  collision_slope_threshold: 0.5
  collision_height_margin: 0.04
  collision_height_softness: 0.015
  collision_speed_scale: 1.0
  collision_speed_floor: 0.25
  crossing_height_threshold: 0.025
  foot_clearance_low: 0.02
  foot_clearance_high: 0.06
  leg_clearance_low: 0.03
  leg_clearance_high: 0.10
  foot_contact_force_threshold: 10.0
  impact_force_free: 20.0
  impact_force_saturation: 150.0
  knee_termination_force: 150.0
  knee_contact_frames: 3
  critical_contact_force: 50.0
  fall_tilt_deg: 45.0
  fall_torso_height: 0.45
  edge_gradient_threshold: 0.04
  edge_activation_height: 0.12
  edge_distance_scale: 0.12

  has_shape_obs: True
  has_shape_obs_disc: True
  has_shape_variation: False
  pregenerated_asset: "models/smpl_humanoid.xml"
  shape_resampling_interval: 250

  pdControl: True
  powerScale: 1.0
  controlFrequencyInv: 2 # 30 Hz
  stateInit: "Start"
  hybridInitProb: 0.5
  numAMPObsSteps: 10
  
  localRootObs: True
  rootHeightObs: False
  keyBodies: ["R_Ankle", "L_Ankle", "R_Wrist",  "L_Wrist"]
  contactBodies: ["R_Ankle", "L_Ankle", "R_Toe", "L_Toe"]
  terminationHeight: 0.15
  enableEarlyTermination: True
  
  numTrajSamples: 10
  trajSampleTimestep: 0.5
  speedMin: 0.0
  speedMax: 3.0
  accelMax: 2.0
  sharpTurnProb: 0.02

  enableTaskObs: True

  asset:
    assetRoot: "/"
    assetFileName: "mjcf/smpl_humanoid.xml"

  terrain:
    terrainType: trimesh # none, plane, or trimesh
    staticFriction: 1.0  # [-]
    dynamicFriction: 1.0  # [-]
    restitution: 0.        # [-]
    # rough terrain only:
    curriculum: true
    maxInitMapLevel: 0
    mapLength: 20.
    mapWidth: 20.
    numLevels: 5
    numTerrains: 20
    # Stage 1: first adapt the official checkpoint to the new reward on easy
    # stairs.  Later stages widen these ranges instead of changing rewards.
    stair_height_min: 0.08
    stair_height_max: 0.12
    stair_tread_min: 0.35
    stair_tread_max: 0.42
    # Flat area at the top of each pyramid stair block, in metres. Shrinking it
    # from 3.0 to 1.0 shortens the run-up a robot can build before the first
    # riser (spawn sampling already excludes the 50 m outer border).
    stair_platform_size: 1.5
    # Spawn almost always on a stair tread instead of a plateau, so the rollout
    # is spent going up/down steps. A point qualifies when the terrain varies by
    # >= stair_spawn_min_spread inside a stair_spawn_window half-window.
    stair_spawn_bias: 1.0
    stair_spawn_window: 0.5
    stair_spawn_min_spread: 0.05
    # terrain types: [smooth slope, rough slope, stairs up, stairs down, discrete, stepping, poles, flat]
    # No slopes in any curriculum stage: 25% down, 60% up, 15% flat.
    terrainProportions: [0.0, 0.0, 0.25, 0.60, 0.0, 0.0, 0.0, 0.15]
    # terrainProportions: [0, 0, 0, 0., 0., 0., 1, 0]
    # terrainProportions: [0, 0, 0, 0, 0, 0., 0, 1]
    # tri mesh only:
    slopeTreshold: 0.9
    
  plane:
    staticFriction: 1.0
    dynamicFriction: 1.0
    restitution: 0.0

sim:
  substeps: 2
  physx:
    num_threads: 4
    solver_type: 1  # 0: pgs, 1: tgs
    num_position_iterations: 4
    num_velocity_iterations: 0
    contact_offset: 0.02
    rest_offset: 0.0
    bounce_threshold_velocity: 0.2
    max_depenetration_velocity: 10.0
    default_buffer_size_multiplier: 10.0

  flex:
    num_inner_iterations: 10
    warm_start: 0.25
